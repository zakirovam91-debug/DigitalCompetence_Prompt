<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Тренажёр промптов для преподавателя</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#1F2D6B; --teal:#0A7F7A; --blue:#0A7F7A; --teal2:#0E9E98; --pale:#BFE6E3; --mint:#CDEBEA; --soft:#F2F9F8; --ink:#1B2540;
  --amber:#F2A93B; --green:#2F9E5B; --red:#C8553D; --line:#D3EAE8; --muted:#4D5A73; --gray:#F1F4F4;
  --shadow:0 10px 30px rgba(31,45,107,.10); --serif:'Merriweather',Georgia,'Times New Roman',serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{position:relative;overflow-x:hidden;margin:0;font-family:'Roboto',Calibri,Carlito,'Segoe UI',Arial,sans-serif;font-size:17px;line-height:1.6;color:var(--ink);background:linear-gradient(to bottom,var(--mint) 0,var(--mint) 300px,var(--gray) 300px);background-repeat:no-repeat;background-color:var(--gray);-webkit-text-size-adjust:100%}
.deco{position:absolute;top:0;left:0;right:0;height:360px;overflow:hidden;z-index:0;pointer-events:none}
.deco::before{content:"";position:absolute;top:-120px;right:-100px;width:380px;height:380px;border-radius:50%;background:rgba(255,255,255,.45)}
.deco::after{content:"";position:absolute;top:150px;right:240px;width:24px;height:24px;border-radius:50%;background:var(--teal2)}
.wrap{position:relative;z-index:1;max-width:1120px;margin:0 auto;padding:26px 20px 90px}
header.top{display:flex;align-items:center;gap:16px;margin-bottom:22px;padding:8px 0 4px}
.logo{flex:0 0 auto;width:56px;height:56px;border-radius:50%;background:var(--teal);display:grid;place-items:center;box-shadow:0 0 0 5px rgba(255,255,255,.6)}
.logo svg{width:28px;height:28px;fill:#fff}
.kicker{font-size:13px;font-weight:700;letter-spacing:.14em;color:var(--teal);text-transform:uppercase}
h1{margin:2px 0 0;font-family:var(--serif);font-weight:700;font-size:32px;line-height:1.2;color:var(--navy)}
.sub{color:#35506B;margin:4px 0 0}
h2{font-family:var(--serif);font-weight:700;font-size:25px;line-height:1.3;color:var(--navy);margin:0 0 12px}
h3{font-family:var(--serif);font-weight:700;font-size:18px;line-height:1.35;color:var(--navy);margin:22px 0 8px}
p{margin:0 0 12px}
.muted{color:var(--muted)}
.small{font-size:15px}

/* stepper */
.stepper{list-style:none;margin:0 0 26px;padding:8px 10px;display:flex;gap:6px;overflow-x:auto;background:#fff;border-radius:999px;box-shadow:var(--shadow);scrollbar-width:thin}
.stepper li{flex:0 0 auto}
.step{display:flex;align-items:center;gap:8px;border:2px solid transparent;background:transparent;color:var(--navy);border-radius:999px;padding:5px 14px 5px 5px;font:inherit;font-size:15px;font-weight:500;cursor:pointer;white-space:nowrap}
.step:hover{background:var(--soft)}
.step .num{width:30px;height:30px;border-radius:50%;background:var(--mint);color:var(--navy);display:grid;place-items:center;font-weight:700;font-size:14px}
.step.done .num{background:var(--green);color:#fff}
.step.active{background:var(--teal);color:#fff}
.step.active .num{background:#fff;color:var(--teal)}
.step:focus-visible,.btn:focus-visible,.opt:focus-visible,.chip:focus-visible,.tab:focus-visible{outline:3px solid var(--teal2);outline-offset:2px}

/* cards & layout */
.card{background:#fff;border-radius:22px;padding:26px 28px;margin-bottom:22px;box-shadow:var(--shadow)}
.card.white{background:#fff}
.card.navy{background:var(--navy);color:#fff;box-shadow:0 14px 34px rgba(31,45,107,.28)}
.card.navy h2,.card.navy h3{color:#fff}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.build{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:22px;align-items:start}
.sticky{position:sticky;top:12px}
@media(max-width:900px){.grid2,.grid3,.build{grid-template-columns:1fr}.sticky{position:static}h1{font-size:26px}h2{font-size:22px}.card{padding:20px 18px;border-radius:18px}.deco{opacity:.6}}
@media(max-width:560px){body{font-size:16px;background:linear-gradient(to bottom,var(--mint) 0,var(--mint) 250px,var(--gray) 250px);background-repeat:no-repeat;background-color:var(--gray)}.wrap{padding:16px 12px 80px}.logo{width:46px;height:46px}.logo svg{width:24px;height:24px}h1{font-size:22px}h2{font-size:20px}h3{font-size:17px}.stepper{border-radius:22px;margin-bottom:18px}.bar{grid-template-columns:96px 1fr 40px}.btn{padding:12px 20px}.navbtns{flex-wrap:wrap}.rc::after{font-size:34px}table.m{font-size:15px}}
@media(max-width:360px){.sub{font-size:15px}.card{padding:16px 14px}.bar{grid-template-columns:80px 1fr 36px}}

/* form */
label.lbl{display:block;font-weight:700;color:var(--navy);margin:0 0 4px;font-size:16px}
.ta,.inp{width:100%;border:2px solid var(--line);border-radius:14px;padding:12px 16px;font:inherit;color:var(--ink);background:#fff}
.ta{resize:vertical;min-height:84px}
.ta:focus,.inp:focus{outline:none;border-color:var(--teal2);box-shadow:0 0 0 4px rgba(14,158,152,.2)}
.ta[readonly]{background:#F4F7F7;color:var(--muted)}
.field{margin-bottom:16px}
.tag{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--teal);color:#fff;font-weight:700;font-size:15px;margin-right:8px}

/* buttons */
.btn{border:0;border-radius:999px;padding:13px 28px;font:inherit;font-weight:700;font-size:16px;cursor:pointer;background:var(--teal);color:#fff;box-shadow:0 6px 16px rgba(10,127,122,.28);transition:background .2s,transform .2s}
.btn:hover{background:#086A66;transform:translateY(-1px)}
.btn.small{padding:8px 18px;font-size:15px}
.btn.alt{background:#fff;color:var(--navy);border:2px solid var(--navy);box-shadow:none}
.btn.alt:hover{background:var(--soft);transform:none}
.btn.amber{background:var(--amber);color:var(--ink)}
.btn.amber:hover{background:#f5b852}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.navbtns{display:flex;justify-content:space-between;gap:12px;margin-top:8px}
.chip{border:2px solid var(--teal2);background:#fff;color:var(--navy);border-radius:999px;padding:6px 14px;font:inherit;font-size:15px;cursor:pointer;text-align:left}
.chip:hover{background:var(--soft)}
.chip.used{background:var(--teal);border-color:var(--teal);color:#fff}

/* RCDF cards */
.rc{position:relative;background:var(--soft);border:1px solid var(--line);border-radius:20px;padding:20px 22px;counter-increment:rc;overflow:hidden}
.grid2{counter-reset:rc}
.rc::after{content:"0" counter(rc);position:absolute;top:10px;right:18px;font-family:var(--serif);font-weight:700;font-size:44px;line-height:1;color:var(--pale);opacity:.8;pointer-events:none}
.rc .letter{display:inline-grid;place-items:center;width:46px;height:46px;border-radius:50%;background:var(--teal);box-shadow:0 0 0 4px var(--mint);color:#fff;font-weight:700;font-size:22px;margin-right:10px}
.rc h3{display:inline;margin:0}
.rc .en{color:var(--teal);font-weight:700;font-size:14px;letter-spacing:.08em;margin-left:6px}
.ex{border-radius:10px;padding:8px 12px;margin-top:8px;font-size:16px}
.ex.bad{background:#FBEDE9}
.ex.good{background:#DDF3E6}
.ex b{display:block;font-size:13px;letter-spacing:.06em;text-transform:uppercase}

/* quiz */
.q{background:var(--soft);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:12px}
.q .t{font-weight:600;margin-bottom:10px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{border:2px solid var(--teal);background:#fff;color:var(--navy);border-radius:999px;padding:6px 16px;font:inherit;font-weight:700;font-size:16px;cursor:pointer}
.opt:hover{background:var(--soft)}
.opt.ok{background:var(--green);border-color:var(--green);color:#fff}
.opt.no{background:var(--red);border-color:var(--red);color:#fff}
.opt:disabled{cursor:default}
.fbtxt{margin-top:8px;font-size:16px}

/* feedback */
.fb-head{display:flex;gap:14px;align-items:center;margin-bottom:10px}
.ring{width:96px;height:96px;flex:0 0 auto}
.ring text{font-family:inherit;font-weight:700}
.lvl{display:inline-block;border-radius:999px;padding:3px 14px;font-weight:700;font-size:16px;color:#fff}
.lv1{background:var(--red)}.lv2{background:#B9791A}.lv3{background:var(--teal)}.lv4{background:var(--green)}
.bars{margin:10px 0}
.bar{display:grid;grid-template-columns:130px 1fr 44px;gap:10px;align-items:center;margin:5px 0;font-size:15px}
.bar .track{height:12px;background:var(--mint);border-radius:999px;overflow:hidden;border:1px solid var(--line)}
.card.navy .bar .track{background:rgba(255,255,255,.18);border-color:transparent}
.bar .fill{height:100%;border-radius:999px;background:var(--teal2)}
.bar .fill.hi{background:var(--green)}.bar .fill.lo{background:var(--red)}
.bar .pct{text-align:right;color:var(--muted)}
.warn{background:#FFF3DC;border-left:0;border-radius:10px;padding:8px 12px;margin:8px 0;font-size:15px}
.warn::before{content:"⚠ ";font-weight:700}
.rules{list-style:none;margin:8px 0 0;padding:0;font-size:15px}
.rules li{display:flex;gap:8px;margin:3px 0}
.rules .ic{flex:0 0 22px;font-weight:700}
.ic.ok{color:var(--green)}.ic.part{color:#B9791A}.ic.no{color:var(--red)}
.rules .hint{color:var(--muted);display:block}
.todo{margin:10px 0 0;padding-left:20px;font-size:16px}
.todo li{margin:4px 0}
.preview{background:var(--soft);border:2px dashed var(--teal2);border-radius:14px;padding:12px 14px;white-space:pre-wrap;font-size:16px;min-height:80px}
.sample{background:#F1FAF4;border:2px solid var(--green);border-radius:14px;padding:12px 14px;margin-top:10px;font-size:16px}

/* tabs */
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.tab{border:2px solid var(--teal);background:#fff;color:var(--navy);border-radius:999px;padding:6px 16px;font:inherit;font-weight:700;cursor:pointer}
.tab.on{background:var(--teal);color:#fff}
.tab.done::after{content:" ✓"}
blockquote.weak{margin:0 0 12px;padding:12px 16px;background:#FBEDE9;border-radius:14px;font-style:italic}

/* pairs */
.pr{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:900px){.pr{grid-template-columns:1fr}}
.opt-card{background:var(--soft);border:2px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px;font-size:16px}
.opt-card.right{border-color:var(--green);background:#EFF9F2}
.opt-card.wrong{border-color:var(--red);background:#FCF1EE}
.opt-card .lab{font-weight:700;color:var(--navy)}

/* iterations */
.it{background:var(--soft);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:12px}
.it-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px;flex-wrap:wrap}
.badge{border-radius:999px;background:var(--navy);color:#fff;padding:3px 14px;font-weight:700}
.delta{font-weight:700}.delta.up{color:var(--green)}.delta.down{color:var(--red)}
.chart{display:flex;align-items:flex-end;gap:10px;height:120px;padding:6px 10px;background:var(--soft);border-radius:14px;border:1px solid var(--line)}
.col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;font-size:14px}
.col .b{width:100%;max-width:60px;background:var(--teal2);border-radius:8px 8px 0 0;min-height:2px}
.checks label{display:flex;gap:10px;align-items:flex-start;margin:8px 0;cursor:pointer}
.checks input{width:22px;height:22px;margin-top:2px;accent-color:var(--teal)}

/* final */
table.m{width:100%;border-collapse:collapse;font-size:17px}
table.m td{padding:9px 10px;border-bottom:1px solid var(--line)}
table.m td:last-child{font-weight:700;text-align:right;white-space:nowrap}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:10px 20px;border-radius:999px;opacity:0;transition:.25s;z-index:20;pointer-events:none;font-size:16px}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
@media(max-width:700px){.deco::after{display:none}}

</style>
</head>
<body>
<div class="deco" aria-hidden="true"></div>
<div class="wrap">
  <header class="top">
    <div class="logo" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 3h16a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H9l-5 4V4a1 1 0 0 1 1-1z"/></svg></div>
    <div>
      <div class="kicker">Практика · Промпт-инжиниринг</div>
      <h1>Тренажёр промптов</h1>
      <p class="sub">Учимся поручать ИИ создание презентации по тексту своей лекции</p>
    </div>
  </header>
  <nav aria-label="Этапы тренажёра"><ol class="stepper" id="stepper"></ol></nav>
  <main id="view"></main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
/* ===== ENGINE: проверка промптов по правилам ===== */
var GROUPS = [
  { id: 'role', name: 'Роль', max: 15 },
  { id: 'ctx', name: 'Контекст', max: 25 },
  { id: 'task', name: 'Задача', max: 20 },
  { id: 'src', name: 'Опора на текст', max: 15 },
  { id: 'fmt', name: 'Формат', max: 15 },
  { id: 'lim', name: 'Ограничения', max: 10 }
];

function reTest(re, t) { return re.test(t) ? 1 : 0; }
var RE_ROLE = /(^|[\s.!?\n])(ты|вы)\s+(—|–|-|опытн|доцент|преподават|методист|эксперт|профессор|специалист|педагог|ассистент|редактор|дизайнер|помощник)|выступ(ай|айте)\s+как|в\s+роли|представь,?\s+что\s+ты|действуй\s+как|твоя\s+роль/i;

var RULES = [
  { id: 'r1', group: 'role', field: 'role', fields: ['role'], pts: 8, label: 'Задана роль ИИ',
    test: function (t) { return reTest(RE_ROLE, t); },
    hint: 'Начните с роли: «Ты методист и дизайнер учебных презентаций…». Роль задаёт уровень и лексику ответа.' },
  { id: 'r2', group: 'role', field: 'role', fields: ['role'], pts: 7, label: 'Роль называет специализацию',
    test: function (t) {
      if (!reTest(RE_ROLE, t)) return 0;
      return /(методист|дизайнер|редактор|эксперт|специалист|разработчик)[^.]*презентаци|презентаци[^.]*(методист|дизайнер|редактор|эксперт|специалист)/i.test(t) ? 1 : 0.4;
    },
    hint: 'Уточните специализацию: «…методист и дизайнер учебных презентаций для вуза».' },

  { id: 'c1', group: 'ctx', field: 'ctx', fields: ['ctx'], pts: 7, label: 'Аудитория: уровень и курс',
    test: function (t) { return reTest(/(бакалавр|магистр|\d\s*курс|курс|студент|слушател|аспирант|групп)/i, t); },
    hint: 'Назовите аудиторию: «бакалавриат, 2 курс» или «магистратура, группа 25 человек».' },
  { id: 'c2', group: 'ctx', field: 'ctx', fields: ['ctx'], pts: 6, label: 'Тема лекции',
    test: function (t) {
      var a = /(дисциплин|тем[аыуе]|раздел)/i.test(t), b = /«[^»]+»/.test(t);
      return a && b ? 1 : (a || b ? 0.5 : 0);
    },
    hint: 'Назовите тему в кавычках: «тема «Договор купли-продажи»».' },
  { id: 'c3', group: 'ctx', field: 'ctx', fields: ['ctx'], pts: 6, label: 'Цель занятия',
    test: function (t) { return reTest(/(цель|чтобы|должн[аы]?|научи|смогут|умел|уметь|после\s+(лекции|занятия))/i, t); },
    hint: 'Добавьте цель: «цель: студенты применяют нормы к ситуации».' },
  { id: 'c4', group: 'ctx', field: 'ctx', fields: ['ctx'], pts: 6, label: 'Формат и время занятия',
    test: function (t) {
      var a = /(лекци|семинар|практическ|занят)/i.test(t);
      var b = /(\d+\s*(?:минут|мин(?![а-яё])|час|академ))/i.test(t);
      return (a ? 0.5 : 0) + (b ? 0.5 : 0);
    },
    hint: 'Укажите тип и длительность: «лекция 80 минут».' },

  { id: 't1', group: 'task', field: 'task', fields: ['task'], pts: 8, label: 'Чёткое действие',
    test: function (t) { return reTest(/(создай|составь|подготовь|сделай|разработай|построй|преобразуй|оформи|сформируй|преврати)/i, t); },
    hint: 'Начните задачу с глагола: «Создай…», «Составь…», «Преврати текст в…».' },
  { id: 't2', group: 'task', field: 'task', fields: ['task'], pts: 6, label: 'Назван ожидаемый результат',
    test: function (t) { return reTest(/(презентаци|слайд)/i, t); },
    hint: 'Назовите результат прямо: «презентацию лекции».' },
  { id: 't3', group: 'task', field: 'task', fields: ['task'], pts: 6, label: 'Указан объём (число слайдов)',
    test: function (t) { return reTest(/\d+\s*(?:[–—-]\s*\d+\s*)?слайд|слайд[а-яё]*\s*[:—–-]?\s*(?:от\s*)?\d+/i, t); },
    hint: 'Задайте объём числом: «на 12 слайдов».' },

  { id: 's1', group: 'src', field: 'task', fields: ['task', 'ctx', 'limits'], pts: 8, label: 'Указан исходный текст лекции',
    test: function (t) { return reTest(/(приложенн|загруженн|прикреплённ|прикреплен|вставленн|по\s+тексту|на\s+основе\s+(?:приложенн|загруженн|моего|текста)|на\s+основании|по\s+(?:моей|приложенной)\s+лекци|мо(?:й|его|ей|ю)\s+(?:текст|лекци|конспект)|ниже\s+(?:текст|привед))/i, t); },
    hint: 'Скажите, что текст приложен: «по приложенному тексту лекции».' },
  { id: 's2', group: 'src', field: 'limits', fields: ['task', 'limits'], pts: 7, label: 'Запрет придумывать от себя',
    test: function (t) { return reTest(/(только\s+(?:по|на|из|приложенн|текст|информаци|факт)|не\s+добавляй|ничего\s+не\s+добавляй|не\s+придумывай|не\s+выдумывай|без\s+добавлени|не\s+используй\s+(?:внешн|сторонн)|не\s+привлекай)/i, t); },
    hint: 'Ограничьте выдумки: «используй только текст, ничего не добавляй от себя».' },

  { id: 'f1', group: 'fmt', field: 'fmt', fields: ['fmt'], pts: 8, label: 'Указано, в каком виде выдать результат',
    test: function (t) { return reTest(/(таблиц|список|столбц|пункт|нумерованн|по\s+слайдам|в\s+виде|структур|формат)/i, t); },
    hint: 'Укажите вид выдачи: «по слайдам нумерованным списком» или «таблица: № слайда, заголовок, тезисы».' },
  { id: 'f2', group: 'fmt', field: 'fmt', fields: ['fmt'], pts: 7, label: 'Перечислены элементы слайда',
    test: function (t) {
      var words = [/заголов/i, /тезис/i, /визуал|иллюстрац|схем|диаграмм/i, /вопрос/i, /заметк|комментар/i, /источник|откуда/i, /определени/i, /пример/i];
      var n = 0; words.forEach(function (w) { if (w.test(t)) n++; });
      return n >= 2 ? 1 : (n === 1 ? 0.5 : 0);
    },
    hint: 'Перечислите, что должно быть на каждом слайде: заголовок, до 3 тезисов, предложение визуала, вопрос аудитории. Можно добавить стиль: строгий, академический.' },

  { id: 'l1', group: 'lim', field: 'limits', fields: ['limits', 'fmt'], pts: 5, label: 'Измеримые ограничения',

  }
  function bindFinal() {
    var m = metrics();
    var b = $('#fCopyP'); if (b) b.onclick = function () { copyText(m.fp); };
    $('#fCopyR').onclick = function () { copyText(reportText(m)); };
    var r = $('#fReset');
    r.onclick = function () {
      if (r.dataset.sure) {
        try { localStorage.removeItem(KEY); } catch (e) {}
        S = { stage: 0, visited: {}, passport: { dir: '', course: '', topic: '', goal: '', format: '' }, diag: { text: '', score: null, done: false }, quiz: {}, build: { role: '', ctx: '', task: '', fmt: '', limits: '' }, train: { idx: 0, texts: ['', '', ''], best: [0, 0, 0], shown: [false, false, false] }, pairs: {}, iters: [{ text: '', note: '' }], checks: {} };
        render();
      } else { r.dataset.sure = '1'; r.textContent = 'Точно удалить весь прогресс? Нажмите ещё раз'; }
    };
  }

  /* ---------- каркас ---------- */
  var VIEWS = [
    { h: stStart, b: bindStart }, { h: stDiag, b: bindDiag }, { h: stRcdf, b: bindRcdf }, { h: stBuild, b: bindBuild },
    { h: stTrain, b: bindTrain }, { h: stPairs, b: bindPairs }, { h: stIter, b: bindIter }, { h: stFinal, b: bindFinal }
  ];
  function go(i) {
    S.stage = Math.max(0, Math.min(STEPS.length - 1, i)); save(); render(); window.scrollTo(0, 0);
  }
  function render() {
    S.visited[S.stage] = true;
    $('#stepper').innerHTML = STEPS.map(function (s, i) {
      var cls = i === S.stage ? 'active' : (S.visited[i] && i < S.stage ? 'done' : '');
      return '<li><button class="step ' + cls + '" data-go="' + i + '"' + (i === S.stage ? ' aria-current="step"' : '') + '><span class="num">' + (cls === 'done' ? '✓' : i + 1) + '</span>' + s.label + '</button></li>';
    }).join('');
    (function () { var a = $('.step.active'), st = $('#stepper'); if (a && st) st.scrollLeft = Math.max(0, a.offsetLeft - st.clientWidth / 2 + a.offsetWidth / 2); })();
    var v = VIEWS[S.stage];
    var nextDis = S.stage === 1 && !S.diag.done;
    $('#view').innerHTML = v.h() +
      '<div class="navbtns"><button class="btn alt" id="bk" ' + (S.stage === 0 ? 'disabled' : '') + '>← Назад</button>' +
      (S.stage < STEPS.length - 1 ? '<button class="btn" id="nx" ' + (nextDis ? 'disabled' : '') + '>Далее →</button>' : '<span></span>') + '</div>' +
      (nextDis ? '<p class="muted small" style="text-align:right">Сначала проверьте промпт, чтобы зафиксировать стартовую оценку.</p>' : '');
    v.b();
    $('#bk').onclick = function () { go(S.stage - 1); };
    var nx = $('#nx'); if (nx) nx.onclick = function () { go(S.stage + 1); };
    $$('.step').forEach(function (b) { b.onclick = function () { go(+b.dataset.go); }; });
  }

  load();
  render();
})();
/* ===== END APP ===== */


</script>
</body>
</html>
